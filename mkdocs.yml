site_name: nichenetr
site_description: Python port of the R nichenetr package for modeling intercellular communication
use_directory_urls: false
theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
  - mkdocs-jupyter:
      include_source: true

nav:
  - Home: index.md
  - API Reference: api.md
  - Tutorials:
    - Step-by-step analysis: tutorials/seurat_steps.ipynb
    - Wrapper approach: tutorials/seurat_wrapper.ipynb
    - Gene set ligand activity: tutorials/ligand_activity_geneset.ipynb
    - Prioritization: tutorials/seurat_steps_prioritization.ipynb
    - Signaling paths: tutorials/ligand_target_signaling_path.ipynb
    - Target prediction evaluation: tutorials/target_prediction_evaluation_geneset.ipynb
    - Single-cell activity: tutorials/ligand_activity_single_cell.ipynb
    - Circos (wrapper): tutorials/seurat_wrapper_circos.ipynb
    - Advanced circos: tutorials/circos.ipynb
