id: nichenetr.calculate_de
import_path: nichenetr.prioritization.calculate_de
kind: function
signature: 'calculate_de(adata: ''ad.AnnData'', celltype_col: ''str'', condition_oi:
  ''Optional[str]'' = None, condition_col: ''Optional[str]'' = None, assay_oi: ''Optional[str]''
  = None, *, features: ''Optional[Sequence[str]]'' = None, min_pct: ''float'' = 0.0,
  logfc_threshold: ''float'' = 0.0) -> ''pd.DataFrame'''
purpose: Compute per-cell-type marker genes (each cell type vs. all others), Python analogue of Seurat FindAllMarkers.
description: >-
  Runs scanpy.tl.rank_genes_groups (Wilcoxon test) grouped by celltype_col on
  an internal copy of adata (adata.X, or adata.layers[assay_oi] if given),
  optionally restricted to condition_oi rows of condition_col, and optionally
  to a features gene subset. Post-filters rows by min_pct/logfc_threshold.
  Does not mutate the caller's adata.
parameters:
- name: adata
  type: ad.AnnData
  required: true
  default: null
- name: celltype_col
  type: str
  required: true
  default: null
- name: condition_oi
  type: str
  required: false
  default: null
  description: Must be given together with condition_col, or neither.
- name: condition_col
  type: str
  required: false
  default: null
- name: assay_oi
  type: str
  required: false
  default: null
- name: features
  type: Sequence[str]
  required: false
  default: null
- name: min_pct
  type: float
  required: false
  default: 0.0
- name: logfc_threshold
  type: float
  required: false
  default: 0.0
mutates: 'execution_class=pure_function; scanpy writes to an internal adata.copy()
  (uns["rank_genes_groups"], including "pts"/"pts_rest"), never to the caller''s
  adata; returns_kind=new_object'
returns: >-
  A new pd.DataFrame with columns [gene, p_val, avg_log2FC, pct.1, pct.2,
  p_val_adj, cluster_id].
requires: []
writes:
- result.de_table
examples:
- 'calculate_de(adata, celltype_col="celltype", condition_oi="High", condition_col="tumor")'
failure_fixes:
- when: Only one of condition_oi/condition_col is given.
  suggest:
  - Raises ValueError "Please provide both condition_col and condition_oi." —
    pass both together or neither.
- when: None of the requested features are present in adata.var_names.
  suggest:
  - Raises ValueError "None of the requested features are in the data." —
    verify gene symbols (e.g. run alias_to_symbol_anndata first).
related:
- nichenetr.get_exprs_avg
- nichenetr.process_table_to_ic
- nichenetr.generate_info_tables
