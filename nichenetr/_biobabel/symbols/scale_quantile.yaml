id: nichenetr.scale_quantile
import_path: nichenetr.scale_quantile
kind: function
signature: 'scale_quantile(x: ''np.ndarray'', outlier_cutoff: ''float'' = 0.05) ->
  ''np.ndarray'''
purpose: Cut off outer quantiles and linearly rescale the remainder to [0, 1].
description: >-
  Computes the outlier_cutoff and (1 - outlier_cutoff) quantiles of x
  (per-column if x is 2-D) and linearly rescales x so that the low quantile
  maps to 0 and the high quantile maps to 1, clamping all values to [0, 1]
  via np.clip. A 1-D input stays 1-D in the output; a 2-D input is scaled
  per column. If a column's high and low quantiles are equal (zero-width
  range), the divisor is substituted with 1.0 instead of dividing by zero.
parameters:
- name: x
  type: np.ndarray
  required: true
  default: null
- name: outlier_cutoff
  type: float
  required: false
  default: 0.05
mutates: 'execution_class=pure_function; no in-place mutation; returns_kind=new_object'
returns: A new np.ndarray, same shape as x, with values rescaled into [0, 1].
requires: []
writes: []
examples:
- 'scale_quantile(np.array([1.0, 5.0, 10.0, 50.0, 100.0]))'
failure_fixes:
- when: A column of x is constant (high quantile equals low quantile).
  suggest:
  - No exception is raised; the divisor is substituted with 1.0 for that
    column instead of dividing by zero.
related:
- nichenetr.scale_quantile_adapted
- nichenetr.scaling_zscore
