[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nichenetr_py"
version = "2.2.1.1"
description = "Python port of the R nichenetr package"
requires-python = ">=3.10"
license = "GPL-3.0-only"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "networkx>=3.0",
    "anndata>=0.10",
    "scanpy>=1.9",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pyarrow>=12.0",
]

[project.optional-dependencies]
circos = ["pycirclize>=1.0"]
dev = ["pytest", "pytest-cov", "ruff"]
docs = ["mkdocs", "mkdocstrings[python]", "mkdocs-material", "mkdocs-jupyter"]

[tool.hatch.build.targets.wheel]
packages = ["nichenetr"]

[tool.hatch.build.targets.wheel.force-include]
"tutorials" = "tutorials"

[tool.pytest.ini_options]
testpaths = ["tests"]
